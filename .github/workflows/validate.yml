name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            jq \
            libxml2-utils \
            shellcheck \
            lua5.4

      - name: Install Python tools
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyyaml

      - name: Validate JSON
        run: |
          files=$(find . -type f -name '*.json' -not -path './.git/*')

          if [ -z "$files" ]; then
            echo "No JSON files found, skipping."
            exit 0
          fi

          while IFS= read -r file; do
            echo "Validating: $file"
            jq empty "$file"
          done <<< "$files"

      - name: Validate XML
        run: |
          files=$(find . -type f -name '*.xml' -not -path './.git/*')

          if [ -z "$files" ]; then
            echo "No XML files found, skipping."
            exit 0
          fi

          while IFS= read -r file; do
            echo "Validating: $file"
            xmllint --noout "$file"
          done <<< "$files"

      - name: Validate YAML
        run: |
          python3 - <<'PY'
          import pathlib
          import yaml

          files = [
              path
              for path in pathlib.Path(".").rglob("*")
              if path.is_file()
              and path.suffix in {".yml", ".yaml"}
              and ".git" not in path.parts
          ]

          if not files:
              print("No YAML files found, skipping.")
              raise SystemExit(0)

          for path in files:
              print(f"Validating: {path}")
              with path.open() as f:
                  yaml.safe_load(f)

              print(f"OK: {path}")
          PY

      - name: Validate shell scripts
        run: |
          files=$(find . -type f -name '*.sh' -not -path './.git/*')

          if [ -z "$files" ]; then
            echo "No shell scripts found, skipping."
            exit 0
          fi

          while IFS= read -r file; do
            echo "Validating: $file"
            shellcheck "$file"
          done <<< "$files"

      - name: Validate PowerShell
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -File -Filter *.ps1 |
            Where-Object { $_.FullName -notmatch '[\\/]\.git[\\/]' }

          if (-not $files) {
            Write-Host "No PowerShell files found, skipping."
            exit 0
          }

          $failed = $false

          foreach ($file in $files) {
            $tokens = $null
            $errors = $null

            [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName,
              [ref]$tokens,
              [ref]$errors
            )

            if ($errors) {
              Write-Error "Syntax errors found in $($file.FullName)"
              $failed = $true
            }
            else {
              Write-Host "OK: $($file.FullName)"
            }
          }

          if ($failed) {
            exit 1
          }

      - name: Validate Lua
        run: |
          files=$(find . -type f -name '*.lua' -not -path './.git/*')

          if [ -z "$files" ]; then
            echo "No Lua files found, skipping."
            exit 0
          fi

          while IFS= read -r file; do
            echo "Validating: $file"
            luac5.4 -p "$file"
          done <<< "$files"
